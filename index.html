<style>
/* ============ Kasir POS — Modern Gen Z · palet tetap: hijau / coklat / emas ============ */
:root{
  --green-900:#0e2a1e; --green-800:#123524; --green-700:#1d4a3a; --green-600:#2f6b54; --green-500:#3d8568;
  --cream:#faf6ef; --cream-2:#f3ead9; --tan:#d8b89a; --brown:#5c4a38; --mut:#8a7a6b;
  --gold:#c9a227; --gold-hi:#e8cf9a; --gold-dk:#9a7b12;
  --white:#ffffff; --ink:#1c2b23; --bd:#e8dcc8; --red:#b53a2e;
  --serif:Georgia,'Times New Roman',serif;
  --sh:0 10px 30px rgba(18,53,36,.10);
  --sh-sm:0 4px 14px rgba(18,53,36,.08);
}
*{box-sizing:border-box}
html{scroll-padding-top:76px}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;border:0;border-radius:14px;padding:11px 16px;background:var(--green-700);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,box-shadow .2s,background .2s}
button:active{transform:scale(.97)}
button.g{background:linear-gradient(135deg,#e8cf9a,#c9a227 60%,#a8860f);color:#241a05;box-shadow:0 8px 20px rgba(201,162,39,.35)}
button.o{background:var(--white);color:var(--green-700);border:1px solid var(--bd);box-shadow:var(--sh-sm)}
button.d{background:var(--white);color:var(--red);border:1px solid var(--bd)}
button.sq{padding:9px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--white);color:var(--ink);font:inherit;margin-bottom:8px;outline:none}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
/* ---- header ---- */
header{background:linear-gradient(180deg,var(--green-800),var(--green-900));color:#fff;position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(14,42,30,.35)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:42px;height:42px;flex:none;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(201,162,39,.45),0 4px 12px rgba(0,0,0,.4);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .nm{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--gold-hi);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tan);line-height:1.2}
nav{display:flex;gap:6px}
nav button{background:rgba(255,255,255,.08);color:var(--tan);padding:9px;border-radius:12px;box-shadow:none}
nav button.on{background:linear-gradient(135deg,#e8cf9a,#c9a227);color:#241a05;box-shadow:0 4px 14px rgba(201,162,39,.35)}
main{max-width:1120px;margin:0 auto;padding:14px 12px}
.wrap{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.wrap{grid-template-columns:1.7fr 1fr}#bar{display:none!important}}
/* ---- cards ---- */
.c{background:var(--white);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.wrap .c{margin:0}
.c h3{font-family:var(--serif);font-size:18px;margin:2px 0 4px;color:var(--green-800)}
.c .hint{color:var(--mut);font-size:12.5px;margin:0 0 8px}
/* ---- rows / fields ---- */
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{flex:1}
.row>.sq{flex:none}
.grow{flex:1;min-width:0}
.fld{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin-bottom:8px;color:var(--green-600);min-width:0}
.fld:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.16)}
.fld>input,.fld>select{border:0;margin:0;padding:11px 0;background:transparent;color:var(--ink);width:100%;outline:none;min-width:0;box-shadow:none}
.fld>input:focus,.fld>select:focus{box-shadow:none}
.fld.sm{width:118px;flex:none}
/* ---- product grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;max-height:62vh;overflow:auto;margin-top:12px;padding:2px}
.pc{background:var(--white);border:1px solid var(--bd);color:var(--ink);padding:10px;text-align:center;font-weight:600;font-size:13px;display:block;border-radius:16px;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .2s}
.pc:active{transform:scale(.96)}
.pc>span{display:block;color:var(--gold-dk);font-weight:800;font-size:14px;margin-top:2px}
.pc small{display:flex;justify-content:center;gap:3px;color:var(--mut);font-weight:500;margin-top:2px}
.pc svg.i{width:14px;height:14px}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,var(--cream-2),var(--cream));display:flex;align-items:center;justify-content:center;color:var(--tan);overflow:hidden;margin-bottom:8px}
.im img{width:100%;height:100%;object-fit:cover}
.im.th{width:46px;height:46px;aspect-ratio:auto;flex:none;margin:0 10px 0 0;border-radius:10px}
.empty{grid-column:1/-1;color:var(--tan);text-align:center;padding:24px}
.empty svg{width:40px;height:40px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:8px 14px;border-radius:99px}
/* ---- cart lines ---- */
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.r:last-child{border:0}
.q{display:flex;gap:6px;align-items:center}
.q button{padding:7px 10px;border-radius:10px}
.q b{min-width:20px;text-align:center}
.amt{min-width:84px;text-align:right;font-weight:800;color:var(--green-800)}
.mu{color:var(--mut);font-size:13px}
.lines{max-height:46vh;overflow:auto}
.tot{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--green-800),var(--green-900));color:var(--gold-hi);border-radius:16px;padding:13px 16px;margin:10px 0;font-size:21px;font-weight:800;box-shadow:0 10px 24px rgba(18,53,36,.28)}
.tot svg{stroke:var(--gold)}
/* ---- camera ---- */
.cam{position:relative;aspect-ratio:4/3;background:var(--green-900);border-radius:16px;overflow:hidden;margin-bottom:10px;color:var(--tan)}
.cam video{width:100%;height:100%;object-fit:cover}
.cam:not(.on) video{display:none}
.cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cam .off svg{width:56px;height:56px}
.cam.on .off{display:none}
.cam .frame{position:absolute;inset:18% 12%;border:2px solid var(--gold);border-radius:14px;pointer-events:none}
.cam:not(.on) .frame{display:none}
/* ---- chips (pilihan varian / ice-hot / channel) ---- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chips button{padding:8px 14px;border-radius:99px;white-space:nowrap}
.chips button.on{background:linear-gradient(135deg,#e8cf9a,#c9a227);color:#241a05}
.chips button.o{background:var(--white);color:var(--green-700);border:1px solid var(--bd);box-shadow:var(--sh-sm)}
/* ---- modal picker varian / ice-hot ---- */
#pickModal{position:fixed;inset:0;background:rgba(14,42,30,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
#pickModal.on{display:flex}
#pickModal .box{background:var(--cream);border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:520px;max-height:82vh;overflow:auto}
#pickModal .box h3{font-family:var(--serif);font-size:19px;margin:0 0 4px;color:var(--green-800)}
/* ---- preview struk monospace ---- */
.rcpre{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 10px;overflow-x:auto}
.rcpre pre{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0;color:#111}
.rcpre pre b{font-weight:800}
.rcpre .big{font-size:20px;font-weight:800;text-align:center;display:block;font-family:Georgia,serif}
.waBtn{background:#25d366;color:#fff;width:100%;font-weight:800}
.waBtn svg{stroke:#fff}
/* ---- nav scroll (7 menu) ---- */
nav{overflow-x:auto;scrollbar-width:none;flex:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px}
/* ---- big stat ---- */
.big{text-align:center}
.big .b{font-size:30px;font-weight:800;color:var(--green-800);font-family:var(--serif)}
.big svg{color:var(--gold-dk)}
/* ---- floating bar ---- */

function fmtTime(d){return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds())}
function fmtDateISO(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function queueNo(t){var ds=new Date(t.t).toDateString();if(!t.no||t.no===0)return S.tx.filter(function(x){return new Date(x.t).toDateString()===ds}).length+1;return S.tx.filter(function(x){return new Date(x.t).toDateString()===ds&&x.no<=t.no}).length||1}
function isDrink(i){return /minum/i.test(i.c||"")}
function activePromos(){var today=fmtDateISO(new Date());return (S.promos||[]).filter(function(p){return p.active&&(!p.from||p.from<=today)&&(!p.to||p.to>=today)})}
function waNum(){var d=String(S.set.wa||"").replace(/[^0-9]/g,"");if(d.startsWith("0"))d="62"+d.slice(1);else if(d.startsWith("8"))d="62"+d;return d}
function promoDisc(sub){if(!promoSel)return null;var v=+promoSel.val||0;if(promoSel.type==="nom")return Math.min(v,sub);return Math.round(sub*v/100)}
/* --- Diagnostik crash print: catat tiap langkah ke localStorage (sinkron) --- */
function plog(step){
  try{
    var log = JSON.parse(localStorage.getItem("kasir_print_log") || "[]");
    log.push({t: Date.now(), s: step});
    if(log.length > 40) log = log.slice(-40);
    localStorage.setItem("kasir_print_log", JSON.stringify(log));
    localStorage.setItem("kasir_print_active", "1");
  }catch(e){}
}
function plogDone(){ try{ localStorage.setItem("kasir_print_active", "0"); }catch(e){} }
function plogCrashInfo(){
  try{
    var active = localStorage.getItem("kasir_print_active") === "1";
    var log = JSON.parse(localStorage.getItem("kasir_print_log") || "[]");
    if(active && log.length){
      var last = log.slice(-6).map(function(x){ return new Date(x.t).toLocaleTimeString("id-ID") + " " + x.s; }).join(" | ");
      return "Aplikasi terakhir mati saat print. Langkah terakhir: " + last;
    }
  }catch(e){}
  return "";
}

function addCart(i,opts){
  opts=opts||{};
  var hasV=(i.v&&i.v.length>0), drink=isDrink(i);
  if(!opts.pick && (hasV||drink)){
    pick={i:i,v:hasV?i.v[0].n:null,ih:drink?"Ice":null};
    render(); return;
  }
  var v=opts.v||null, ih=opts.ih||null;
  var price=i.p;
  if(v){var vv=(i.v||[]).find(function(x){return x.n===v}); if(vv) price=vv.p;}
  var qtyInCart=cart.filter(function(x){return x.id==i.id}).reduce(function(a,x){return a+x.q},0);
  if(stk(i)&&qtyInCart+1>i.s) return toast("Stok habis");
  var c=cart.find(function(x){return x.id==i.id&&x.v===v&&x.ih===ih});
  if(c) c.q++;
  else cart.push({id:i.id,n:i.n,p:price,q:1,v:v,ih:ih});
  pick=null; render();
}

function lr(a,b,w){var sp=w-a.length-b.length;return sp<1?a.slice(0,w-b.length-1)+" "+b:a+" ".repeat(sp)+b}
function ct(s,w){s=s.slice(0,w);return " ".repeat(Math.floor((w-s.length)/2))+s}

/* ============ STRUK LUXURY ============ */
/* ESC/POS untuk printer thermal Bluetooth — dibangun sebagai BYTE ARRAY
   (bukan string) supaya byte kontrol (ESC/GS/parameter) tidak terbuang.
   Nama toko double-size + bold, TOTAL bold, alignment rapi. */
function b64bytes(s){var bin=atob(s),out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
function txtB(s){return Array.from(new TextEncoder().encode(String(s).replace(/[^\x20-\x7E\n]/g,"?")))} /* pertahankan LF, buang karakter non-ASCII lain */
/* ============ STRUK 58mm (32 karakter/baris) ============ */
/* Satu sumber kebenaran: rcptText() menghasilkan baris-baris teks yang
   SUDAH diformat lebar tetap (rata kiri/kanan/tengah). rcpt() mengubahnya
   jadi byte ESC/POS (logo + nama toko double-size + TOTAL tebal), dan
   rcptHTML() menampilkannya sebagai preview monospace di layar — jadi
   preview di layar SAMA PERSIS dengan hasil cetak. */
function rcptText(tx){
  var w=S.set.w, f=function(n){return Math.round(n).toLocaleString("id-ID")}, L=[];
  var d=new Date(tx.t);
  L.push({s:S.set.name, big:1});
  if(S.set.tag) L.push({s:ct(S.set.tag,w)});
  if(S.set.addr) L.push({s:ct(S.set.addr,w)});
  L.push({s:"-".repeat(w)});
  L.push({s:lr("Antrian: "+queueNo(tx), fmtDate(d), w)});
  var cust=(tx.cust||"").trim();
  if(cust) L.push({s:lr("Customer: "+cust, fmtTime(d), w)});
  else L.push({s:lr("", fmtTime(d), w)});
  if(tx.ch) L.push({s:"Channel: "+tx.ch});
  L.push({s:"-".repeat(w)});
  tx.items.forEach(function(i){
    L.push({s:i.n.slice(0,w)});
    if(i.v) L.push({s:"  - "+i.v});
    if(i.ih) L.push({s:"  - "+i.ih});
    L.push({s:lr("  "+i.q+" x "+f(i.p), f(i.p*i.q), w)});
  });
  L.push({s:"-".repeat(w)});
  L.push({s:lr("Subtotal", "Rp"+f(tx.sub), w)});
  if(tx.disc){
    var dl=(tx.discType==="pct"&&tx.discPct)?"Diskon ("+tx.discPct+"%)":"Diskon";
    L.push({s:lr(dl, "-Rp"+f(tx.disc), w)});
  }
  if(tx.tax) L.push({s:lr("Pajak", "Rp"+f(tx.tax), w)});
  L.push({s:"-".repeat(w)});
  L.push({s:lr("TOTAL", "Rp"+f(tx.total), w), b:1});
  L.push({s:lr("Bayar", "Rp"+f(tx.pay), w)});
  L.push({s:lr("Kembali", "Rp"+f(tx.chg), w)});
  L.push({s:"-".repeat(w)});
  L.push({s:ct(S.set.foot, w)});
  if(S.set.wa) L.push({s:ct("Kritik & Saran: "+S.set.wa, w)});
  L.push({s:""}); L.push({s:""}); L.push({s:""}); // 3 baris kosong sebelum potong
  return L;
}

function rcpt(tx){
  var w=S.set.w, b=[];
  var push=function(){for(var i=0;i<arguments.length;i++){var a=arguments[i];if(typeof a==="string")b.push.apply(b,txtB(a));else b.push(a)}};
  push(0x1b,0x40);                    // ESC @ init
  push(0x1b,0x61,0x01);               // rata tengah
  // logo raster (GS v 0) — hitam-putih, di tengah
  var rb=b64bytes(LOGO_RASTER.b64);
  push(0x1d,0x76,0x30,0,LOGO_RASTER.bw,0,LOGO_RASTER.h&255,(LOGO_RASTER.h>>8)&255);
  for(var ri=0;ri<rb.length;ri++)push(rb[ri]);
  push(10); // LF setelah logo
  push(0x1b,0x61,0x00);               // rata kiri
  rcptText(tx).forEach(function(L){
    if(L.big){ push(0x1b,0x61,0x01); push(0x1d,0x21,0x11); push(L.s,"\n"); push(0x1d,0x21,0x00); push(0x1b,0x61,0x00); }
    else if(L.b){ push(0x1b,0x45,0x01); push(L.s,"\n"); push(0x1b,0x45,0x00); }
    else push(L.s,"\n");
  });
  return new Uint8Array(b);
}

/* Preview struk di layar (monospace, sama persis dengan hasil cetak). */
function rcptHTML(tx){
  var lines=rcptText(tx).map(function(L){
    var s=esc(L.s);
    if(L.big) return '<span class="big">'+s+'</span>';
    if(L.b) return '<b>'+s+'</b>';
    return s;
  }).join("\n");
  return '<div class="rcpre"><pre>'+lines+'</pre></div>';
}

// ===== NATIVE (APK Capacitor): cetak langsung ke printer Bluetooth Classic (SPP) =====
// Tanpa RawBT, tanpa Web Bluetooth. Pakai plugin Capacitor @fmesasc/capacitor-bluetooth-serial
// (masih di-maintain, support Android 12+ / BLUETOOTH_CONNECT & BLUETOOTH_SCAN).
// Printer iware (Bluetooth biasa) hanya bisa dijangkau lewat jalur ini.
// Data dikirim sebagai array angka (byte mentah) supaya struk ESC/POS + logo raster
// tidak rusak saat lewat bridge (bukan base64, bukan string UTF-8).
// Semua operasi Bluetooth dibungkus try/catch: error tampil sebagai toast, app tidak crash.
function isNative(){ try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }catch(e){ return !!window.Capacitor; } }
// ===== NATIVE (APK Capacitor): cetak langsung ke printer Bluetooth Classic (SPP) =====
// Tanpa RawBT, tanpa Web Bluetooth. Pakai plugin Cordova cordova-plugin-bluetooth-serial
// (service "BluetoothSerial", window.bluetoothSerial). Printer iware (Bluetooth biasa)
// hanya bisa dijangkau lewat jalur ini.
// Data dikirim sebagai array angka (integer 0-255) -> plugin JS mengubahnya jadi
// ArrayBuffer -> Java getArrayBuffer(0) -> byte mentah. Jadi struk ESC/POS + logo raster
// tidak rusak (bukan string UTF-8, bukan base64).
// Semua operasi Bluetooth dibungkus try/catch: error tampil sebagai toast, app tidak crash.
function isNative(){ try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }catch(e){ return !!window.Capacitor; } }
function hasBTSerial(){
  var hasWin = typeof window.bluetoothSerial !== "undefined";
  var hasExec = !!(window.cordova && typeof cordova.exec === "function");
  plog("hasBTSerial: window.bluetoothSerial=" + (hasWin?"ada":"TIDAK ADA") + ", cordova.exec=" + (hasExec?"ada":"TIDAK ADA"));
  return hasWin;
}
var btDevs = []; // daftar perangkat paired (native)
var btConn = { ok:false, name:"" }; // status koneksi native (untuk label "● terhubung")
function btName(mac){
  var d = btDevs.filter(function(x){ return (x.address||x.id) === mac; })[0];
  return d ? (d.name || d.address || d.id) : mac;
}
function btErrMsg(e){
  var m = (e && e.message) ? e.message : String(e);
  if(/not implemented|UNIMPLEMENTED/i.test(m)) return "Plugin Bluetooth tidak ketemu di aplikasi. Install ulang APK terbaru.";
  if(/permission|izin|denied|BLUETOOTH_CONNECT/i.test(m)) return "Izin Bluetooth belum diberikan. Izinkan 'Perangkat di sekitar' di Pengaturan aplikasi.";
  return m;
}

// --- Izin runtime BLUETOOTH_CONNECT / BLUETOOTH_SCAN (Android 12+) ---
// Dicek + diminta DULU sebelum connect/write/scan. Kalau ditolak, lempar Error
// berbahasa Indonesia (tampil sebagai toast), bukan crash.
function btPerms(names){
  return new Promise(function(resolve, reject){
    var perms = (window.cordova && cordova.plugins && cordova.plugins.permissions) ? cordova.plugins.permissions : null;
    if(!perms) return resolve(true); // tanpa plugin izin, andalkan cek internal plugin BT
    var list = names.map(function(n){ return perms[n]; }).filter(Boolean);
    if(!list.length) return resolve(true);
    try{
      perms.requestPermissions(list, function(st){
        if(st && st.hasPermission) return resolve(true);
        reject(new Error("Izin Bluetooth belum diberikan. Izinkan 'Perangkat di sekitar' di Pengaturan aplikasi."));
      }, function(){ reject(new Error("Gagal meminta izin Bluetooth.")); });
    }catch(e){ reject(new Error("Gagal cek izin Bluetooth: " + (e && e.message ? e.message : e))); }
  });
}
function btPermConnect(){ return btPerms(["BLUETOOTH_CONNECT"]); }
function btPermScan(){ return btPerms(["BLUETOOTH_SCAN","BLUETOOTH_CONNECT"]); }

function btEnsure(){
  return new Promise(function(resolve, reject){
    if(!hasBTSerial()) return reject(new Error("Plugin Bluetooth belum siap. Tutup lalu buka lagi aplikasinya."));
    var mac = S.set.btMac;
    if(!mac) return reject(new Error("Pilih printer dulu di Setting > Printer Bluetooth."));
    btPermConnect().then(function(){
      plog("btEnsure: cek isEnabled");
      window.bluetoothSerial.isEnabled(function(){
        plog("btEnsure: isEnabled OK, cek isConnected");
        window.bluetoothSerial.isConnected(function(){
          plog("btEnsure: sudah terhubung"); btConn = {ok:true, name: btName(mac)}; resolve(true);
        }, function(){
          plog("btEnsure: connect secure " + mac);
          window.bluetoothSerial.connect(mac, function(){
            plog("btEnsure: connect OK"); btConn = {ok:true, name: btName(mac)}; resolve(true);
          }, function(){
            plog("btEnsure: connect gagal, coba insecure");
            window.bluetoothSerial.connectInsecure(mac, function(){
              plog("btEnsure: connectInsecure OK"); btConn = {ok:true, name: btName(mac)}; resolve(true);
            }, function(e2){
              btConn = {ok:false, name:""};
              plog("btEnsure: GAGAL sambung");
              reject(new Error("Gagal sambung ke printer. Pastikan printer nyala & sudah di-pair di Bluetooth HP."));
            });
          });
        });
      }, function(){
        plog("btEnsure: BT mati, minta enable");
        window.bluetoothSerial.enable(function(){ btEnsure().then(resolve).catch(reject); }, function(){
          plog("btEnsure: GAGAL enable BT");
          reject(new Error("Nyalakan Bluetooth dulu."));
        });
      });
    }).catch(function(e){ plog("btEnsure: GAGAL " + btErrMsg(e)); reject(e); });
  });
}

function sendBTNATIVE(bytes){
  plog("sendBTNATIVE: mulai, rcpt " + bytes.length + " byte");
  return btEnsure().then(function(){
    var u = new Uint8Array([27,64].concat(Array.from(bytes),[10,10,10,10]));
    plog("sendBTNATIVE: total " + u.length + " byte, tulis per 512");
    return new Promise(function(resolve, reject){
      var i = 0, c = 0;
      (function next(){
        if(i >= u.length){ plog("sendBTNATIVE: selesai semua chunk"); plogDone(); return resolve(); }
        var chunk = u.slice(i, i+512);
        i += chunk.length; c++;
        plog("sendBTNATIVE: tulis chunk " + c + " (" + chunk.length + " byte)");
        try{
          window.bluetoothSerial.write(Array.from(chunk), function(){ setTimeout(next, 30); }, function(e){
            plogDone();
            plog("sendBTNATIVE: GAGAL chunk " + c + " " + btErrMsg(e));
            reject(new Error("Gagal kirim ke printer: " + btErrMsg(e)));
          });
        }catch(e){
          plogDone();
          plog("sendBTNATIVE: GAGAL (exception) " + btErrMsg(e));
          reject(new Error("Gagal kirim ke printer: " + btErrMsg(e)));
        }
      })();
    });
  }).catch(function(e){
    plogDone();
    if(e && e.message) throw e;
    throw new Error("Gagal kirim ke printer: " + btErrMsg(e));
  });
}

function btListDevices(){
  plog("btListDevices: mulai");
  if(!hasBTSerial()){ toast("Hanya tersedia di aplikasi (APK)."); return; }
  btPermScan().then(function(){
    plog("btListDevices: izin OK, cek isEnabled");
    window.bluetoothSerial.isEnabled(function(){
      plog("btListDevices: isEnabled OK, baca daftar paired");
      window.bluetoothSerial.list(function(devs){
        btDevs = devs || [];
        plog("btListDevices: ketemu " + btDevs.length + " perangkat paired");
        if(!btDevs.length){ toast("Tidak ada printer yang di-pair. Pair dulu di Bluetooth HP."); render(); return; }
        render();
        toast("Ketuk nama printer untuk memilih");
      }, function(e){
        var m = btErrMsg(e);
        plog("btListDevices: GAGAL baca daftar " + m);
        toast("Gagal membaca daftar Bluetooth: " + m);
      });
    }, function(){
      plog("btListDevices: GAGAL BT mati");
      toast("Bluetooth HP mati. Nyalakan dulu Bluetooth-nya.");
    });
  }).catch(function(e){
    var m = btErrMsg(e);
    plog("btListDevices: GAGAL " + m);
    toast("Gagal cari printer: " + m);
  });
}

// --- Lihat / Salin Log Print (localStorage kasir_print_log) ---
function plogText(){
  try{
    var log = JSON.parse(localStorage.getItem("kasir_print_log") || "[]");
    if(!log.length) return "Belum ada log print.";
    return log.map(function(x){ return new Date(x.t).toLocaleTimeString("id-ID") + "  " + x.s; }).join("\n");
  }catch(e){ return "Log tidak bisa dibaca."; }
}
function plogCopy(txt){
  function done(){ toast("Log disalin"); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ plogCopyFallback(txt); done(); });
  } else { plogCopyFallback(txt); done(); }
}
function plogCopyFallback(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

function out(t){
if(isNative()){
  plog("out: Tes/Bayar cetak, buat rcpt");
  var rb;
  try{ rb = rcpt(t); plog("out: rcpt jadi " + rb.length + " byte"); }
  catch(e){ plogDone(); toast("Gagal cetak: " + e.message); return; }
  sendBTNATIVE(rb).then(function(){ toast("Terkirim ke printer"); }).catch(function(e){ plogDone(); toast("Gagal cetak: "+e.message); });
  return;
}
if((S.set.pm||"rawbt")==="rawbt"){
  $("#rcptHtml").innerHTML=rcptHTML(t);
  toast("Pilih RawBT di dialog print");
  setTimeout(()=>window.print(),300);
  return;
}
sendBT(rcpt(t)).then(()=>toast("Terkirim ke printer")).catch(e=>toast("Gagal cetak: "+e.message))}

async function conn(){
if(!navigator.bluetooth)throw Error("Browser ga support Bluetooth. Pake Chrome Android.");
var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0x18f0,0xffe0,0xff00,"49535343-fe7d-4ae5-8fa9-9fafd205e455","e7810a71-73ae-499d-8c15-faa9aef0c3f2"]});
var g=await d.gatt.connect(),sv=await g.getPrimaryServices();ch=null;
for(var s of sv){for(var c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}}if(ch)break}
if(!ch)throw Error("Printer ini ga support mode BLE. Pake mode dialog print.");dev=d}
async function sendBT(bytes){
if(!ch||!dev||!dev.gatt.connected)await conn();
var u=new Uint8Array([27,64].concat(Array.from(bytes),[10,10,10,10]));
for(var i=0;i<u.length;i+=100){var p=u.slice(i,i+100);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);await new Promise(r=>setTimeout(r,30))}}

render();
</script>
