name: Build APK Kasir POS

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/bulid-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          curl -sL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/Android/Sdk/cmdline-tools
          mv $HOME/Android/Sdk/cmdline-tools/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "$HOME/Android/Sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/Android/Sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        working-directory: apk
        run: npm ci

      - name: Sync Capacitor
        working-directory: apk
        run: |
          ./node_modules/.bin/cap sync android || echo "cap sync gagal, pakai aset dari repo"
          cp www/index.html android/app/src/main/assets/public/index.html

      - name: Generate launcher icons + splash
        run: |
          pip install pillow -q
          python3 .github/scripts/generate-icons.py

      - name: Build debug APK
        working-directory: apk/android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-pos-debug
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
