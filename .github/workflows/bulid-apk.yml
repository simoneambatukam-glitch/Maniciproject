name: Build APK Kasir POS

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        working-directory: apk
        run: npm ci

      - name: Sync Capacitor
        working-directory: apk
        run: npx cap sync android

      - name: Generate launcher icons + splash
        run: |
          pip install pillow -q
          python3 .github/scripts/generate-icons.py

      - name: Build debug APK
        working-directory: apk/android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-pos-debug
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
